description: "OneHaus household organiser through the official remote MCP server (Streamable HTTP at https://mcp.onehaus.app). OAuth 2.0 with PKCE and dynamic client registration, scopes haus.read and haus.write. Calendar, chores, shopping, meals and home admin for the signed-in household. Bundles one workflow skill. Agent Plugins v1 package (plugin.json, mcp.json, skills/), configuration only. Disclosure: hosted-only connector with no local code; every tool call goes to mcp.onehaus.app. A OneHaus account is required. The package marks the server untrusted, so Hermes asks before any tool that is not read-only and refuses those calls in unattended runs. The tool list is served by the remote server at runtime and is not covered by the pinned sha."
